name: ci

on:
  push:
  pull_request:

jobs:
  minimal-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: make check
      - run: python -m hok_agent accept-minimal-v1 --seed 101
