name: ci

on:
  push:
  pull_request:

jobs:
  minimal-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,bc]'
      - run: make check
      - run: make accept
      - run: make accept-v2
