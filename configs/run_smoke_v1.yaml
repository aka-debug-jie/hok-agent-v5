version: 1

run:
  artifact_type: environment_smoke
  config_version: 1
  formal: false
  promotion_eligible: false

environment:
  kind: mock
  service_endpoint: "local://mock"
  mode: "1v1"
  seed_start: 1000
  episodes: 10
  max_steps_per_episode: 256

policy:
  kind: deterministic_random
  action_schema_version: 1

checks:
  protocol_errors_maximum: 0
  action_decode_errors_maximum: 0
  illegal_executed_actions_maximum: 0
  replay_errors_maximum: 0
  terminal_rate_minimum: 1.0
  fixed_seed_replay_exact: true
  reward_components_finite: true
  tick_monotonic: true

artifacts:
  output_root: "artifacts/runs"
  write_run_manifest: true
  write_episode_rows: true
  write_evaluation_report: true
