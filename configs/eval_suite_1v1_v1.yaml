version: 1

suite:
  id: eval-suite-pixelarena-1v1-v1
  version: 1
  enabled: false
  status: LOCKED_PENDING_M3_AND_SCOPED_SCHEMA_V2
  evaluation_tier: E2
  promotion_eligible: true
  activation_gate: M3_BC_CLOSED_LOOP_PASS_AND_SCOPED_SCHEMA_V2
  mode: "1v1"
  environment_kind: pixelarena
  claim_scope: pixelarena_internal
  ruleset_id: pixelarena_1v1_v1
  hok_capability_claim: false
  gamecore_equivalence_claim: false

cohort:
  archetype: vanguard_v1
  opponents:
    - id: scripted_primary
      weight: 0.5
    - id: active_or_historical_secondary
      weight: 0.5
  sides:
    - id: side_0
      episodes: 100
      seed_start: 200000
    - id: side_1
      episodes: 100
      seed_start: 200100
  total_episodes: 200
  training_seed_overlap_permitted: false
  checkpoint_frozen_before_eval: true

metrics:
  report_wilson_interval: true
  report_by_side: true
  report_by_opponent: true
  report_by_archetype: true
  report_action_distribution: true
  report_objective_progress: true
  report_engineering_errors: true

promotion:
  overall_win_rate_minimum: 0.70
  each_side_win_rate_minimum: 0.60
  complete_episode_rate_minimum: 0.99
  protocol_errors_maximum: 0
  action_decode_errors_maximum: 0
  illegal_executed_actions_maximum: 0
  replay_errors_maximum: 0
  nonfinite_events_maximum: 0
  attributable_structure_or_crystal_damage_required: true
  dominant_active_action_share_maximum: 0.90
  active_wilson_lower_bound_strict_improvement_required: true
  non_degradation_with_other_primary_strict_improvement_permitted: true
  independent_training_seed_passes_minimum: 2
  independent_training_seed_count: 3
  results_may_tune_reward: false
  results_may_select_training_update: false

disposition:
  pass: PROMOTED_ACTIVE
  fail: REJECTED_CAPABILITY_OR_REGRESSION
  invalid: INVALID_ROLLBACK
