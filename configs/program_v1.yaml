version: 1

program:
  id: hok-agent-v5
  version: 1
  route_id: pixelarena-local-v1
  product_label: pixelarena-moba-research-agent
  created_date: "2026-08-11"
  north_star: pixelarena_fixed_archetype_1v1_closed_loop_win
  current_milestone: M1
  current_task: TASK-010
  current_status: READY

repositories:
  active_repo: "."
  legacy_repo: "https://github.com/aka-debug-jie/pixel-moba-codex-starter"
  legacy_read_only: true
  legacy_checkpoint_inputs_permitted: false

environments:
  strategy_authority:
    kind: pixelarena
    ownership: project_owned
    authority_scope: project_internal_closed_loop
    implementation_status: planned_task_010
    claim_scope: pixelarena_internal
    may_claim_hok_capability: false
    identity_required: true
  diagnostic:
    kind: mock
    promotion_eligible: false
    may_claim_hok_capability: false
  optional_external_calibration:
    kind: hok_gamecore
    enabled: false
    dependency_of_main_route: false
    status: NOT_AVAILABLE
    connection_status: not_available
    license_status: unknown
    external_authorization_attested: false
    external_authorization_evidence_ref: null
    promotion_registry: separate
    may_inherit_pixelarena_promotion: false
  commercial_client:
    mode: read_only_shadow
    automated_actions_permitted: false

runtime:
  learner_python: ">=3.11"
  pixelarena_service_python: ">=3.11"
  optional_gamecore_service_python: ">=3.6,<3.10"
  accelerator: "NVIDIA RTX 4090-class"
  environment_service_isolated: true

claims:
  default_scope: pixelarena_internal
  hok_capability_claim_permitted: false
  gamecore_equivalence_claim_permitted: false
  cross_environment_promotion_permitted: false

policy:
  action_space: factorized
  k96_hard_candidate_space_permitted: false
  recurrent_core_initial: GRU
  target_attention: true
  actor_privileged_inputs_permitted: false
  legal_mask_in_actor_encoder_permitted: false

training:
  order:
    - pixelarena_environment
    - scripted_baselines_and_dataset
    - behavior_cloning
    - recurrent_ppo
    - opponent_league
    - multi_archetype
    - mappo_3v3
    - vision_distillation
  full_run_requires_mini_gate: true
  promotion_uses_training_cohort: false
  independent_training_seeds_for_promotion: 3

operations:
  pixelarena_environment_implementation_permitted: true
  pixelarena_engineering_rollout_permitted: true
  pixelarena_learned_policy_closed_loop_permitted: false
  pixelarena_training_permitted: false
  pixelarena_promotion_permitted: false
  gamecore_transport_permitted: false
  commercial_client_actions_permitted: false

safety:
  real_client_read_only: true
  adb_input_permitted: false
  scrcpy_control_permitted: false
  hid_uinput_permitted: false
  accessibility_automation_permitted: false
  root_hook_memory_protocol_modification_permitted: false
  anti_cheat_evasion_permitted: false
  license_or_secret_in_git_permitted: false

locks:
  gamecore_transport: true
  gamecore_evaluation: true
  behavior_cloning: true
  long_training: true
  ppo: true
  gamecore_promotion: true
  multi_archetype: true
  three_v_three: true
  vision_policy: true
  real_client_closed_loop: true
